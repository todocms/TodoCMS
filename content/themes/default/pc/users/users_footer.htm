<script>
(function(){
  function join(base, path){ return String(base||'').replace(/\/+$/, '') + '/' + String(path||'').replace(/^\/+/, ''); }
  var siteUrl = '{{todo:site_url}}';
  var siteRoot = '{{todo:site_url|default}}';
  window.TODO = window.TODO || {};
  window.TODO.SITE_URL = window.TODO.SITE_URL || siteUrl;
  window.TODO.SITE_ROOT = window.TODO.SITE_ROOT || siteRoot;
  window.TODO.join = window.TODO.join || join;
  window.TODO.ADMIN_BASE = window.TODO.ADMIN_BASE || join(siteRoot, '/admin');
  window.TODO.ADMIN_AJAX = window.TODO.ADMIN_AJAX || join(siteRoot, '/admin/ajax');
  window.TODO.INCLUDES_AJAX = window.TODO.INCLUDES_AJAX || join(siteRoot, '/includes/ajax');
  window.TODO.API_BASE = window.TODO.API_BASE || join(siteRoot, '/api');
  window.TODO.CONTENT_BASE = window.TODO.CONTENT_BASE || join(siteRoot, '/content');
  window.TODO.PUBLIC_BASE = window.TODO.PUBLIC_BASE || '{{todo:public_url}}';
  window.TODO_LANG = {{todo:lang_pack_json}};
})();
</script>
